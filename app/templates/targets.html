{% extends "base.html" %}
{% block content %}
<div class="row g-4">
    <div class="col-lg-4">
        <div class="saas-card p-4 reveal-up">
            <h2 class="h6 fw-bold text-uppercase mb-3">
                <i class="bi bi-plus-circle text-crimson me-2"></i>Register Authorized Target
            </h2>
            <form method="POST" action="{{ url_for('targets.add_target') }}">
                <div class="mb-3">
                    <label class="form-label small text-secondary">Target Name</label>
                    <input type="text" name="name" class="form-control bg-dark text-light border-secondary" placeholder="OWASP Juice Shop" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">Base URL (Localhost Only)</label>
                    <input type="url" name="base_url" class="form-control bg-dark text-light border-secondary mono-text" placeholder="http://127.0.0.1:3000" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">Environment</label>
                    <input type="text" name="environment" class="form-control bg-dark text-light border-secondary" value="Local Docker Lab">
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-semibold">Add In-Scope Target</button>
            </form>
        </div>
    </div>

    <div class="col-lg-8">
        <div class="saas-card p-4 reveal-up">
            <h2 class="h6 fw-bold text-uppercase mb-3">
                <i class="bi bi-bullseye text-crimson me-2"></i>Authorized Targets & Scope
            </h2>
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr class="text-secondary small">
                            <th>Target</th>
                            <th>Scope Prefix</th>
                            <th>Environment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for t in targets %}
                        <tr>
                            <td class="fw-semibold">{{ t.name }}</td>
                            <td class="mono-text small text-crimson">{{ t.scope_prefix }}</td>
                            <td class="small text-secondary">{{ t.environment }}</td>
                            <td class="d-flex gap-2">
                                <form method="POST" action="{{ url_for('targets.start_assessment', target_id=t.id) }}">
                                    <button class="btn btn-sm btn-outline-danger">New Assessment</button>
                                </form>
                                <form method="POST" action="{{ url_for('targets.delete_target', target_id=t.id) }}">
                                    <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
